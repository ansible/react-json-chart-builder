name: Check GH_TOKEN authentication

on:
  workflow_dispatch:

# This check uses the GH_TOKEN secret, not the job-scoped GITHUB_TOKEN.
permissions: {}

jobs:
  check-token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check token authentication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh api /user > /dev/null
