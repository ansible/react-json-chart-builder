name: Check GH_TOKEN authentication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/check-gh-token.yml

# This check uses the GH_TOKEN secret, not the job-scoped GITHUB_TOKEN.
permissions: {}

jobs:
  check-token:
    if: github.event.pull_request.number == 20
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check token authentication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Credential is unavailable"
            exit 1
          fi

          if status="$(
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              curl --config - --silent --max-time 15 \
                --output /dev/null --write-out '%{http_code}' \
                https://api.github.com/repos/ansible/react-json-chart-builder \
                2>/dev/null
          )"; then
            case "$status" in
              200)
                echo "GitHub accepted the credential for the public read request"
                ;;
              401)
                echo "GitHub rejected the credential (HTTP 401)"
                exit 1
                ;;
              403)
                echo "GitHub denied the request (HTTP 403; permission or rate-limit condition)"
                exit 1
                ;;
              429)
                echo "GitHub rate-limited the request (HTTP 429)"
                exit 1
                ;;
              *)
                echo "GitHub returned an unexpected HTTP status: ${status:-unknown}"
                exit 1
                ;;
            esac
          else
            echo "GitHub request failed before an HTTP response was received"
            exit 2
          fi
