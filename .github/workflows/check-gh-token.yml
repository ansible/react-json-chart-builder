name: Check GH_TOKEN authentication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/check-gh-token.yml

# This check uses the GH_TOKEN secret, not the job-scoped GITHUB_TOKEN.
permissions: {}

jobs:
  check-token:
    if: github.event.pull_request.number == 20
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check token authentication
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh api /user > /dev/null
